<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ride With Pals — Your Elite Riding Community</title>
    <meta name="description" content="Ride With Pals — Join the elite community of high-performance riders. Manage your club, rides, activities, and more from one powerful platform." />
    <meta name="theme-color" content="#EB712B" />

    <!-- Preload Landing Page CSS for instant paint on first visit -->
    <link rel="preload" href="/landing/styles.css" as="style" />

    <!-- Prevent flash of unstyled content: lock background before React mounts -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #050505;
        min-height: 100vh;
      }
      #app-loading-screen {
        position: fixed;
        inset: 0;
        background: #050505;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(235, 113, 43, 0.2);
        border-top-color: #EB712B;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Google Fonts: Poppins (headings) + Roboto (body) — sibling typography to Admin Panel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Native loading screen: covers any flash before React hydrates -->
    <div id="app-loading-screen">
      <div class="app-spinner"></div>
    </div>

    <!-- Main application root -->
    <div id="root"></div>

    <!-- GSAP Modal Portal root — Logout confirms, destructive action dialogs mount here -->
    <div id="modal-root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
